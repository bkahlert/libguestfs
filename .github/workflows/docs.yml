name: docs

on:
  push:
    branches: ['master']
    paths-ignore: ['**.md','**.svg']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: ● REC terminal sessions
        uses: bkahlert/recordr@v0.2.6
        env:
          RECORDRW_IMAGE_TAG: '0.2.6'
        with:
          build-dir: build/rec
          out-dir: build/pages

      - name: Upload ● REC artifacts
        uses: actions/upload-artifact@v7.0.2
        if: success() || failure()
        with:
          name: rec-artifacts
          if-no-files-found: ignore
          path: build/rec

      - name: Create site index
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<title>libguestfs recordings</title>' \
            '<p>Terminal recordings for <a href="https://github.com/bkahlert/libguestfs">libguestfs</a>.</p>' \
            > build/pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/pages

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Deploy recordings
        id: deployment
        uses: actions/deploy-pages@v5.0.1
