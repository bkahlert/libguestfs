name: docs

on:
  push:
    branches: ['master']
    tags: ['v*']
    paths-ignore: ['**.md','**.svg']
  pull_request:
    branches: ['master']
    paths-ignore: ['**.md','**.svg']
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}--docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Prepare
        id: prep
        run: |
          {
            echo "recordr-branch=${REF_NAME}--docs"
            echo "recordr-build-dir=build/rec"
          } >> "$GITHUB_OUTPUT"
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: ● REC terminal sessions
        if: github.event_name != 'pull_request'
        id: recordr
        uses: bkahlert/recordr@v0.2.3
        with:
          branch: ${{ steps.prep.outputs.recordr-branch }}
          build-dir: ${{ steps.prep.outputs.recordr-build-dir }}

      - name: Upload ● REC artifacts
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && (success() || failure())
        with:
          name: rec-artifacts
          if-no-files-found: error
          path: ${{ steps.prep.outputs.recordr-build-dir }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        if: startsWith(github.ref, 'refs/heads/')
        with:
          commit-message: |
            ${{ github.workflow }}(docs): update ${{ steps.recordr.outputs.file-list }}
          title: |
            ${{ github.workflow }}(docs): update ${{ steps.recordr.outputs.file-list }}
          body: |
            Updates ${{ steps.recordr.outputs.file-list }}
            ${{ steps.recordr.outputs.markdown }}
          labels: recordr,docs,rec
          branch: ${{ steps.prep.outputs.recordr-branch }}
