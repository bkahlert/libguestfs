name: test-report

on:
  workflow_run:
    workflows: ['build']
    types: ['completed']

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-reports
          name: Bats tests
          path: '*.xml'
          reporter: java-junit
